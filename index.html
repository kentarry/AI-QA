<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品檢流程看板</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0f0f1a;--surface:#1a1a2e;--card:#16213e;--card-hover:#1a2744;
--accent:#6c63ff;--accent2:#e94560;--accent3:#00d2ff;--accent4:#0f9b58;
--text:#ffffff;--text-dim:#b0b0c0;--border:rgba(255,255,255,.1);
--shadow:0 8px 32px rgba(0,0,0,.4);--radius:14px;
}
body{font-family:'Noto Sans TC','Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:15px}

/* Header */
.header{padding:24px 32px;display:flex;align-items:center;justify-content:space-between;
background:linear-gradient(135deg,rgba(108,99,255,.12),rgba(0,210,255,.08));
border-bottom:1px solid var(--border);backdrop-filter:blur(20px);flex-wrap:wrap;gap:16px}
.header-left{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.header h1{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#6c63ff,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.search-input{
  background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
  padding:10px 20px 10px 42px;border-radius:24px;font-size:1rem;outline:none;width:260px;transition:all .2s;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23b0b0c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>');
  background-repeat:no-repeat;background-position:14px center;
}
.search-input::placeholder{color:var(--text-dim)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.15);width:300px}

.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stats{display:flex;gap:10px}
.stat{background:rgba(255,255,255,.06);padding:8px 16px;border-radius:24px;font-size:.9rem;color:var(--text-dim);border:1px solid var(--border)}
.stat span{font-weight:700;color:var(--text);font-size:1rem;margin-left:4px}
.btn-add-global{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;border:none;padding:10px 24px;border-radius:12px;
font-size:1rem;cursor:pointer;font-weight:600;transition:all .25s;display:flex;align-items:center;gap:8px;white-space:nowrap}
.btn-add-global:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(108,99,255,.4)}
.btn-outline{background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:10px 16px;border-radius:12px;
font-size:.95rem;cursor:pointer;font-weight:600;transition:all .2s;white-space:nowrap}
.btn-outline:hover{background:rgba(255,255,255,.08);color:var(--text)}

/* Tabs */
.tabs { display: flex; gap: 8px; background: rgba(255,255,255,.05); padding: 4px; border-radius: 12px; margin-left: 16px; }
.tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 8px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all .2s; }
.tab-btn.active { background: rgba(255,255,255,.1); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.2); }

/* Board */
.board{display:flex;gap:20px;padding:24px 32px;min-height:calc(100vh - 100px);align-items:flex-start;overflow-x:auto;padding-bottom:50px}
.board::-webkit-scrollbar{height:10px}
.board::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:10px}

/* Column */
.column{flex:1 1 260px;min-width:280px;max-width:340px;background:var(--surface);border-radius:var(--radius);
border:1px solid var(--border);display:flex;flex-direction:column;transition:all .3s;max-height:calc(100vh - 150px)}
.column.drag-over{border-color:var(--accent);box-shadow:0 0 30px rgba(108,99,255,.2)}
.col-header{padding:20px 24px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.col-title{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.15rem;letter-spacing:0.5px}
.col-dot{width:12px;height:12px;border-radius:50%}
.col-count{background:rgba(255,255,255,.08);padding:4px 14px;border-radius:16px;font-size:.9rem;color:var(--text);font-weight:700}
.col-body{padding:16px;flex:1;min-height:120px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.col-body::-webkit-scrollbar{width:6px}
.col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;
cursor:grab;transition:all .25s;position:relative;animation:cardIn .35s ease}
.card:hover{background:var(--card-hover);transform:translateY(-3px);box-shadow:var(--shadow);border-color:rgba(255,255,255,.25)}
.card.dragging{opacity:.5;transform:rotate(2deg)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title{font-weight:600;font-size:1.15rem;flex:1;word-break:break-word;line-height:1.5;color:var(--text)}
.card-actions{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.card:hover .card-actions{opacity:1}
.card-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:6px;border-radius:8px;font-size:1.05rem;transition:all .2s;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.card-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.card-btn.del:hover{color:var(--accent2)}

/* Progress Tag & Collapse states */
.card-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.card-progress{font-size:.85rem;padding:4px 10px;border-radius:6px;font-weight:700;display:inline-block;letter-spacing:0.5px;background:rgba(0,210,255,.15);color:#00d2ff;border:1px solid rgba(0,210,255,.3)}
.card.collapsed .card-note,
.card.collapsed .card-date,
.card.collapsed .card-move {
  display: none;
}

.card-members{display:flex;flex-wrap:wrap;gap:8px}
.member-tag{background:linear-gradient(135deg,rgba(108,99,255,.25),rgba(0,210,255,.2));padding:4px 12px;border-radius:8px;
font-size:.85rem;color:#64dfdf;border:1px solid rgba(0,210,255,.3);font-weight:500}
.card-note{font-size:.95rem;color:var(--text-dim);line-height:1.6;background:rgba(255,255,255,.04);padding:12px 14px;border-radius:8px;
margin-top:10px;border-left:4px solid rgba(108,99,255,.5);word-break:break-word;white-space:pre-wrap}
.card-date{font-size:.8rem;color:rgba(255,255,255,.3);margin-top:16px;display:flex;justify-content:flex-end}
.card-move{display:flex;gap:8px;margin-top:16px;border-top:1px solid rgba(255,255,255,.06);padding-top:12px}
.move-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:8px;
font-size:.85rem;cursor:pointer;transition:all .2s;flex:1;text-align:center;font-weight:600}
.move-btn:hover{background:rgba(108,99,255,.2);color:var(--text);border-color:rgba(108,99,255,.4)}
.move-btn.btn-reject { color: var(--accent2); border-color: rgba(233,69,96,.3); background: rgba(233,69,96,.05); }
.move-btn.btn-reject:hover { background: rgba(233,69,96,.15); color: #ff879a; border-color: rgba(233,69,96,.5); }

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:none;
align-items:center;justify-content:center;z-index:100;animation:fadeIn .2s}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 40px;
width:92%;max-width:600px;box-shadow:0 30px 100px rgba(0,0,0,.6);animation:slideUp .3s ease;max-height:90vh;overflow-y:auto}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}

.modal h2{font-size:1.5rem;margin-bottom:28px;background:linear-gradient(135deg,#6c63ff,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.form-group{margin-bottom:22px}
.form-group label{display:block;font-size:1rem;color:var(--text-dim);margin-bottom:10px;font-weight:600}
.form-group input,.form-group textarea,.form-group select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);
color:var(--text);padding:14px 18px;border-radius:12px;font-size:1.05rem;font-family:inherit;transition:all .2s;outline:none}
.form-group select option { background: var(--surface); color: var(--text); }
.form-group input::placeholder, .form-group textarea::placeholder{color:rgba(255,255,255,.3)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.form-group textarea{resize:vertical;min-height:100px;line-height:1.5}
.form-row{display:flex;gap:20px}
.form-row .form-group{flex:1;margin-bottom:0}

.members-input{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;min-height:50px;align-items:center;cursor:text;transition:all .2s}
.members-input.focused{border-color:var(--accent);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.members-input .tag{background:linear-gradient(135deg,rgba(108,99,255,.3),rgba(0,210,255,.25));padding:6px 12px;border-radius:8px;
font-size:.95rem;display:flex;align-items:center;gap:8px;color:#64dfdf;font-weight:500}
.members-input .tag button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:1.1rem;padding:0;line-height:1}
.members-input input{background:none;border:none;color:var(--text);outline:none;font-size:1.05rem;flex:1;min-width:100px;padding:4px}
.modal-btns{display:flex;gap:16px;margin-top:32px}
.modal-btns button{flex:1;padding:14px;border-radius:12px;border:none;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:0.5px}
.btn-save{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff}
.btn-save:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(108,99,255,.4)}
.btn-cancel{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.15)!important}
.btn-cancel:hover{background:rgba(255,255,255,.15)}
.btn-danger{background:rgba(233,69,96,.15);color:#ff6b81;border:1px solid rgba(233,69,96,.3)!important}
.btn-danger:hover{background:rgba(233,69,96,.25);color:#ff879a}

/* Animations */
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Placeholder */
.empty-msg{text-align:center;color:rgba(255,255,255,.2);font-size:1rem;padding:50px 10px;user-select:none;font-weight:500}

/* Members View */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;width:100%;align-items:start;padding-bottom:20px}
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;animation:fadeIn .3s ease}
.member-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px}
.member-name{font-size:1.25rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.member-name::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent3)}
.member-task-count{background:rgba(255,255,255,.08);padding:4px 10px;border-radius:12px;font-size:.85rem;color:var(--text-dim)}
.member-tasks{display:flex;flex-direction:column;gap:10px}
.member-task{background:var(--card);border:1px solid var(--border);padding:12px;border-radius:8px;transition:all .2s;cursor:pointer}
.member-task:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.task-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.task-name{font-weight:600;font-size:1rem;color:var(--text);flex:1;word-break:break-word;line-height:1.4}
.task-badge{font-size:.75rem;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap;margin-left:8px}
.task-progress{font-size:.8rem;color:var(--text-dim);display:flex;align-items:center;gap:6px}

/* Toast */
.toast{position:fixed;bottom:32px;right:32px;background:var(--surface);border:1px solid var(--border);padding:16px 28px;
border-radius:14px;color:var(--text);font-size:1.05rem;font-weight:600;box-shadow:var(--shadow);z-index:200;
animation:slideUp .3s ease;transition:opacity .3s;border-left:5px solid var(--accent)}
.toast.hide{opacity:0}

/* ====== 增量擴充：AI 工具表格樣式 ====== */
.aitools-container{padding:24px 32px;width:100%;animation:fadeIn .3s ease}
.aitools-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.aitools-title{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:12px}
.aitools-title-text{background:linear-gradient(135deg,#6c63ff,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.aitools-badge{background:rgba(108,99,255,.15);color:var(--accent);font-size:.85rem;padding:4px 14px;border-radius:16px;font-weight:700;border:1px solid rgba(108,99,255,.3)}
.aitools-refresh-info{font-size:.85rem;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.aitools-refresh-dot{width:8px;height:8px;border-radius:50%;background:#0f9b58;animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.aitools-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;overflow-x:auto}
.aitools-table{width:100%;border-collapse:collapse;table-layout:auto}
.aitools-table thead{background:linear-gradient(135deg,rgba(108,99,255,.12),rgba(0,210,255,.08))}
.aitools-table th{padding:16px 20px;text-align:left;font-weight:700;font-size:.95rem;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap}
.aitools-table td{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.95rem;color:var(--text-dim);vertical-align:top;word-break:break-word}
.aitools-table tbody tr{transition:all .2s}
.aitools-table tbody tr:hover{background:rgba(108,99,255,.06)}
.aitools-table tbody tr:last-child td{border-bottom:none}
.aitools-tool-name{font-weight:700;color:var(--text);font-size:1.05rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.aitools-tool-icon{font-size:1.2rem}
.aitools-version{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(15,155,88,.2),rgba(0,210,255,.15));padding:5px 14px;border-radius:8px;font-size:.9rem;font-weight:700;color:#64dfdf;border:1px solid rgba(0,210,255,.25);white-space:nowrap;margin-right:8px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.aitools-path{font-family:'Consolas','Courier New',monospace;font-size:.85rem;color:var(--text-dim);background:rgba(255,255,255,.04);padding:8px 12px;border-radius:6px;line-height:1.6;white-space:pre-wrap;border-left:3px solid rgba(108,99,255,.4);word-break:break-all}
.aitools-desc{line-height:1.6;color:var(--text-dim)}
.aitools-desc-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--text-dim);padding:8px 12px;border-radius:6px;font-size:.9rem;font-family:inherit;outline:none;transition:all .25s;line-height:1.5}
.aitools-desc-input::placeholder{color:rgba(255,255,255,.2)}
.aitools-desc-input:focus{border-color:var(--accent);background:rgba(255,255,255,.08);color:var(--text);box-shadow:0 0 0 2px rgba(108,99,255,.15)}
.aitools-desc-input.saved{border-color:#0f9b58;box-shadow:0 0 8px rgba(15,155,88,.4)}
.aitools-desc-input.save-error{border-color:var(--accent2);box-shadow:0 0 8px rgba(233,69,96,.3)}
.aitools-id{font-family:monospace;font-size:.8rem;color:rgba(255,255,255,.3)}
.aitools-update-time{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text-dim);white-space:nowrap;background:rgba(255,255,255,.04);padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.06)}
.aitools-update-time .aitools-clock-icon{font-size:.95rem;opacity:.7}
.aitools-empty{text-align:center;padding:80px 20px;color:rgba(255,255,255,.2)}
.aitools-empty-icon{font-size:3rem;margin-bottom:16px}
.aitools-empty-text{font-size:1.1rem;font-weight:500}
.aitools-loading{text-align:center;padding:60px 20px;color:var(--text-dim)}
.aitools-loading-spinner{display:inline-block;width:28px;height:28px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.aitools-table th:nth-child(1),.aitools-table td:nth-child(1){width:42px;min-width:42px}
.aitools-table th:nth-child(2),.aitools-table td:nth-child(2){min-width:130px}
.aitools-table th:nth-child(3),.aitools-table td:nth-child(3){min-width:100px;padding-right:24px}
.aitools-table th:nth-child(6),.aitools-table td:nth-child(6){min-width:155px;white-space:nowrap}
/* ====== 增量擴充結束 ====== */

</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>📋 品檢流程看板</h1>
    <div class="tabs">
      <button class="tab-btn active" id="tab-board" onclick="switchTab('board')">看板視圖</button>
      <button class="tab-btn" id="tab-members" onclick="switchTab('members')">人員狀態</button>
      <button class="tab-btn" id="tab-archive" onclick="switchTab('archive')">備存庫</button>
      <button class="tab-btn" id="tab-aitools" onclick="switchTab('aitools')">🤖 已上線 AI 工具</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="搜尋項目或成員…" onkeyup="render()">
  </div>
  <div class="header-right">
    <div class="stats">
      <div class="stat" title="總計項目數">總數 <span id="statTotal">0</span></div>
      <div class="stat" title="進行中與驗收中">進行中 <span id="statActive">0</span></div>
      <div class="stat" title="已完成項目">已完成 <span id="statDone">0</span></div>
      <div class="stat" title="被駁回與刪除數" style="border-color:rgba(233,69,96,.3)">備存 <span id="statRejected" style="color:var(--accent2)">0</span></div>
    </div>
    <button class="btn-add-global" onclick="openModal()">＋ 新增項目</button>
  </div>
</div>

<div class="board" id="board"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增項目</h2>
    <div class="form-group">
      <label>項目名稱 *</label>
      <input type="text" id="inputName" placeholder="輸入項目名稱…">
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>所屬狀態</label>
        <select id="inputStatus">
          <option value="todo">尚未製作</option>
          <option value="progress">製作中</option>
          <option value="review">驗收中</option>
          <option value="done">已完成</option>
          <option value="rejected">已駁回</option>
          <option value="deleted">已刪除</option>
        </select>
      </div>
      <div class="form-group">
        <label>完成進度 (%)</label>
        <input type="number" id="inputProgress" min="0" max="100" placeholder="0 - 100">
      </div>
    </div>

    <div class="form-group" style="margin-top:18px">
      <label>成員名稱（輸入後按 Enter 新增多位）</label>
      <div class="members-input" id="membersBox" onclick="document.getElementById('memberInput').focus()">
        <input type="text" id="memberInput" placeholder="輸入名稱後按 Enter…">
      </div>
    </div>
    <div class="form-group">
      <label>備註說明</label>
      <textarea id="inputNote" placeholder="輸入備註或相關資訊…"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-danger" id="btnDelete" style="display:none" onclick="deleteItem()">刪除</button>
      <button class="btn-save" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<script>
// ★★★ 請將此處替換為你自己部署的 GAS Web App 網址 ★★★
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw9LPdsBzyKtCcXcubhMxPV-yji1oA-0QE0X8L2VaqfuvwYnaMR66Jag4FELfDEt-VIfg/exec';

const TEAM_MEMBERS = [
  "張致宇", "周啟堂", "王雯鈺", "宋灝平", "洪全緯", 
  "蔡曜宇", "林榆昕", "林敏雄", "簡伶珊", "郭冠麟", 
  "王溶蓁", "李敏瑞", "秦嘉佑", "許昕慈", "江冠錡", 
  "呂孟軒", "穆道生", "許庭瑊", "彭毓雯"
];

// 定義所有看板欄位
const MAIN_COLUMNS = [
  {id:'todo',     label:'尚未製作', color:'#6c63ff'},
  {id:'progress', label:'製作中',   color:'#f5a623'},
  {id:'review',   label:'驗收中',   color:'#00d2ff'},
  {id:'done',     label:'已完成',   color:'#0f9b58'}
];
const ARCHIVE_COLUMNS = [
  {id:'rejected', label:'已駁回',   color:'#e94560'},
  {id:'deleted',  label:'已刪除',   color:'#999999'}
];
const ALL_COLUMNS = [...MAIN_COLUMNS, ...ARCHIVE_COLUMNS];

const LS_KEY = 'kanban_items_v3';

let items = [];
let editingId = null;
let tempMembers = [];
let isDragging = false;
let hashState = '';
let currentTab = 'board';

// 即時同步函式
function fetchData() {
  const isModalOpen = document.getElementById('modalOverlay').classList.contains('active');
  if (isDragging || isModalOpen) return; // 正在操作卡片或填寫表單時，暫停畫面覆蓋以免中斷操作
  
  fetch(GAS_URL)
    .then(r => r.json())
    .then(data => {
      if (!Array.isArray(data)) return;
      const newHash = JSON.stringify(data);
      // 比對資料，只有當有別人更新內容時才重新渲染畫面，避免畫面閃爍
      if (newHash !== hashState) {
        items = data;
        hashState = newHash;
        render();
      }
    })
    .catch(() => {}); // 伺服器未開啟時略過
}

// 啟動即時同步 (每 2 秒抓取一次最新資料)
fetchData();
setInterval(fetchData, 2000);

// ── Render ──
function render() {
  const board = document.getElementById('board');
  const searchKeyword = (document.getElementById('searchInput').value || '').toLowerCase();
  
  board.innerHTML = '';
  
  if (currentTab === 'members') {
    const grid = document.createElement('div');
    grid.className = 'members-grid';
    
    TEAM_MEMBERS.forEach(member => {
      let memberItems = items.filter(i => 
        i.members && i.members.some(m => m.trim() === member) && i.status !== 'deleted' && i.status !== 'rejected'
      );
      
      if (searchKeyword) {
        if (!member.toLowerCase().includes(searchKeyword)) {
          memberItems = memberItems.filter(i => 
            i.name.toLowerCase().includes(searchKeyword) || 
            (i.note && i.note.toLowerCase().includes(searchKeyword))
          );
          if (memberItems.length === 0) return;
        }
      }

      const statusOrder = { 'todo': 1, 'progress': 2, 'review': 3, 'done': 4 };
      memberItems.sort((a, b) => (statusOrder[a.status] || 99) - (statusOrder[b.status] || 99));

      const card = document.createElement('div');
      card.className = 'member-card';
      
      let tasksHtml = '';
      if (memberItems.length === 0) {
        tasksHtml = '<div class="empty-msg" style="padding:20px 10px;font-size:0.9rem;border:1px dashed rgba(255,255,255,0.1);border-radius:8px">目前無負責項目</div>';
      } else {
        tasksHtml = '<div class="member-tasks">' + memberItems.map(item => {
          const col = MAIN_COLUMNS.find(c => c.id === item.status) || {color:'#999', label:'未知'};
          return `
            <div class="member-task" onclick="openModal('${item.id}')">
              <div class="task-header">
                <div class="task-name">${esc(item.name)}</div>
                <div class="task-badge" style="background:${col.color}20;color:${col.color};border:1px solid ${col.color}40">${col.label}</div>
              </div>
              <div class="task-progress">進度: ${item.progress || 0}%</div>
            </div>
          `;
        }).join('') + '</div>';
      }

      card.innerHTML = `
        <div class="member-header">
          <div class="member-name">${esc(member)}</div>
          <div class="member-task-count">${memberItems.length} 項</div>
        </div>
        ${tasksHtml}
      `;
      grid.appendChild(card);
    });
    
    board.appendChild(grid);
    updateStats();
    return;
  }

  const columnsToRender = currentTab === 'board' ? MAIN_COLUMNS : ARCHIVE_COLUMNS;
  columnsToRender.forEach(col => {
    // 過濾出屬於該欄位的卡片
    let colItems = items.filter(i => i.status === col.id);
    
    // 搜尋過濾
    if (searchKeyword) {
      colItems = colItems.filter(i => 
        i.name.toLowerCase().includes(searchKeyword) || 
        (i.members && i.members.some(m => m.toLowerCase().includes(searchKeyword))) ||
        (i.note && i.note.toLowerCase().includes(searchKeyword))
      );
    }

    const div = document.createElement('div');
    div.className = 'column';
    div.dataset.status = col.id;
    
    // 拖曳事件綁定
    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => { e.preventDefault(); div.classList.remove('drag-over'); dropCard(e, col.id); });

    div.innerHTML = `
      <div class="col-header">
        <div class="col-title"><span class="col-dot" style="background:${col.color}"></span>${col.label}</div>
        <span class="col-count">${colItems.length}</span>
      </div>
      <div class="col-body" id="col-${col.id}">
        ${colItems.length === 0 ? '<div class="empty-msg">尚無項目或拖曳至此</div>' : ''}
      </div>`;
    board.appendChild(div);

    const body = div.querySelector('.col-body');
    // 依據時間排序，新的在上面
    colItems.sort((a,b) => b.createdAt - a.createdAt).forEach(item => {
      body.appendChild(createCard(item, col));
    });
  });
  
  updateStats();
}

function createCard(item, col) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = item.id;
  card.addEventListener('dragstart', e => { 
    isDragging = true;
    e.dataTransfer.setData('text/plain', item.id); 
    card.classList.add('dragging'); 
  });
  card.addEventListener('dragend', () => {
    isDragging = false;
    card.classList.remove('dragging');
  });

  const activeCols = currentTab === 'board' ? MAIN_COLUMNS : ARCHIVE_COLUMNS;
  const colIdx = activeCols.findIndex(c => c.id === col.id);
  const moves = [];
  
  if (currentTab === 'board' && col.id !== 'done') {
    if (colIdx > 0) {
      moves.push({id: activeCols[colIdx-1].id, label: '◀ ' + activeCols[colIdx-1].label});
    }
    if (colIdx < activeCols.length - 1) {
      moves.push({id: activeCols[colIdx+1].id, label: activeCols[colIdx+1].label + ' ▶'});
    }
    if (col.id === 'review') {
      moves.push({id: 'rejected', label: '駁回 ❌', isDanger: true});
    }
  }

  if (item.isCollapsed) card.classList.add('collapsed');

  card.innerHTML = `
    <div class="card-top">
      <div class="card-title">${esc(item.name)}</div>
      <div class="card-actions">
        <button class="card-btn" onclick="toggleCollapse('${item.id}')" title="展開/縮小">${item.isCollapsed ? '🔼' : '🔽'}</button>
        <button class="card-btn" onclick="openModal('${item.id}')" title="編輯">✏️</button>
        <button class="card-btn del" onclick="confirmDel('${item.id}')" title="刪除">🗑️</button>
      </div>
    </div>
    <div class="card-info">
      ${item.members && item.members.length ? `<div class="card-members">${item.members.map(m=>`<span class="member-tag">${esc(m)}</span>`).join('')}</div>` : ''}
      <div class="card-progress">進度: ${item.progress || 0}%</div>
    </div>
    ${item.note ? `<div class="card-note">${esc(item.note)}</div>` : ''}
    <div class="card-date">${formatDate(item.createdAt)}</div>
    ${moves.length ? `<div class="card-move">${moves.map(m=>`<button class="move-btn ${m.isDanger ? 'btn-reject' : ''}" onclick="moveCard('${item.id}','${m.id}')">${m.label}</button>`).join('')}</div>` : ''}
  `;
  return card;
}

function dropCard(e, newStatus) {
  const id = e.dataTransfer.getData('text/plain');
  const item = items.find(i => i.id === id);
  if (item && item.status !== newStatus) {
    item.status = newStatus;
    if (newStatus === 'done') item.completedAt = Date.now();
    save(); 
    toast(`已移至「${ALL_COLUMNS.find(c=>c.id===newStatus).label}」`);
  }
}

function moveCard(id, newStatus) {
  const item = items.find(i => i.id === id);
  if (item) {
    item.status = newStatus;
    if (newStatus === 'done') item.completedAt = Date.now();
    save(); 
    toast(`已移至「${ALL_COLUMNS.find(c=>c.id===newStatus).label}」`);
  }
}

function toggleCollapse(id) {
  const item = items.find(i => i.id === id);
  if (item) {
    item.isCollapsed = !item.isCollapsed;
    save();
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  render();
}

// ── Modal ──
function openModal(id) {
  editingId = id || null;
  tempMembers = [];
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('active');
  document.getElementById('modalTitle').textContent = id ? '編輯項目' : '新增項目';
  document.getElementById('btnDelete').style.display = id ? 'block' : 'none';

  if (id) {
    const item = items.find(i => i.id === id);
    document.getElementById('inputName').value = item.name;
    document.getElementById('inputStatus').value = item.status;
    document.getElementById('inputProgress').value = item.progress !== undefined ? item.progress : (item.status === 'todo' ? 0 : 0);
    document.getElementById('inputNote').value = item.note || '';
    tempMembers = [...(item.members || [])];
  } else {
    document.getElementById('inputName').value = '';
    document.getElementById('inputStatus').value = 'todo';
    document.getElementById('inputProgress').value = 0;
    document.getElementById('inputNote').value = '';
  }
  renderMembers();
  setTimeout(() => document.getElementById('inputName').focus(), 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null; tempMembers = [];
}

function saveItem() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) { 
    document.getElementById('inputName').style.borderColor='var(--accent2)'; 
    document.getElementById('inputName').focus();
    return; 
  }
  
  const status = document.getElementById('inputStatus').value;
  const progress = parseInt(document.getElementById('inputProgress').value) || 0;
  const note = document.getElementById('inputNote').value.trim();

  if (editingId) {
    const item = items.find(i => i.id === editingId);
    item.name = name; 
    item.status = status; 
    item.progress = progress; 
    item.note = note; 
    item.members = [...tempMembers];
    if (status === 'done' && !item.completedAt) item.completedAt = Date.now();
    toast('✅ 已更新項目');
  } else {
    items.push({
      id: uid(), 
      name, 
      status, 
      progress, 
      note, 
      members: [...tempMembers], 
      createdAt: Date.now(),
      isCollapsed: false
    });
    toast('✅ 已新增項目');
  }
  
  // 重置搜尋
  document.getElementById('searchInput').value = '';
  save(); 
  closeModal();
}

function deleteItem() {
  if (!editingId) return;
  const item = items.find(i => i.id === editingId);
  if (item) {
    if (item.status === 'deleted') {
      if (confirm('此項目已在備存庫中，確定要永久刪除嗎？')) {
        items = items.filter(i => i.id !== editingId);
        save();
        closeModal();
        toast('🗑️ 已永久刪除');
      }
    } else {
      item.status = 'deleted';
      save();
      closeModal();
      toast('🗑️ 已移至備存庫');
    }
  }
}

function confirmDel(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (item.status === 'deleted') {
    if (confirm('此項目已在備存庫中，確定要永久刪除嗎？')) {
      items = items.filter(i => i.id !== id);
      save();
      toast('🗑️ 已永久刪除');
    }
  } else {
    if (confirm('確定要刪除此項目嗎？將移至備存庫。')) {
      item.status = 'deleted';
      save(); 
      toast('🗑️ 已移至備存庫');
    }
  }
}

// ── Members Tags ──
function renderMembers() {
  const box = document.getElementById('membersBox');
  box.querySelectorAll('.tag').forEach(t => t.remove());
  const input = document.getElementById('memberInput');
  tempMembers.forEach((m, i) => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.innerHTML = `${esc(m)} <button onclick="removeMember(${i})">✕</button>`;
    box.insertBefore(tag, input);
  });
}

function removeMember(i) { 
  tempMembers.splice(i, 1); 
  renderMembers(); 
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('memberInput');
  const box = document.getElementById('membersBox');
  
  document.getElementById('inputStatus').addEventListener('change', function() {
    if (this.value === 'todo') {
      document.getElementById('inputProgress').value = 0;
    }
  });
  
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = input.value.trim();
      if (v && !tempMembers.includes(v)) { 
        tempMembers.push(v); 
        input.value = ''; 
        renderMembers(); 
      }
    }
    if (e.key === 'Backspace' && !input.value && tempMembers.length) { 
      tempMembers.pop(); 
      renderMembers(); 
    }
  });
  
  input.addEventListener('focus', () => box.classList.add('focused'));
  input.addEventListener('blur', () => box.classList.remove('focused'));

  document.getElementById('modalOverlay').addEventListener('click', e => { 
    if (e.target === e.currentTarget) closeModal(); 
  });
  
  document.addEventListener('keydown', e => { 
    if (e.key === 'Escape') closeModal(); 
  });
  
  render();
});

// ── Helpers ──
function save() { 
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(items)
  })
  .then(() => {
    hashState = JSON.stringify(items);
    render();
  })
  .catch(() => toast('❌ 同步失敗，請確認伺服器是否開啟'));
}

function uid() { 
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); 
}

function esc(s) { 
  const d = document.createElement('div'); 
  d.textContent = s; 
  return d.innerHTML; 
}

function formatDate(ts) { 
  if (!ts) return ''; 
  const d = new Date(ts); 
  return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; 
}

function updateStats() {
  document.getElementById('statTotal').textContent = items.filter(i=>i.status!=='deleted'&&i.status!=='rejected').length;
  document.getElementById('statActive').textContent = items.filter(i=>i.status==='progress'||i.status==='review').length;
  document.getElementById('statDone').textContent = items.filter(i=>i.status==='done').length;
  document.getElementById('statRejected').textContent = items.filter(i=>i.status==='rejected'||i.status==='deleted').length;
}

function toast(msg) {
  const t = document.createElement('div'); 
  t.className = 'toast'; 
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('hide'), 2000);
  setTimeout(() => t.remove(), 2300);
}

// ====================================================================
// 增量擴充區域：AI 工具即時抓取與渲染
// 此區域的程式碼完全不影響上方既有看板邏輯
// ====================================================================

function fetchAiTools() {
  fetch(GAS_URL + '?type=aitools')
    .then(r => r.text())
    .then(text => {
      console.log('[AI工具] GAS 回傳原始資料：', text.substring(0, 500));
      try {
        var data = JSON.parse(text);
      } catch(e) {
        console.error('[AI工具] JSON 解析失敗：', e.message);
        aiToolsLoading = false;
        return;
      }
      console.log('[AI工具] 解析後資料：', Array.isArray(data) ? data.length + ' 筆' : typeof data, data);
      if (!Array.isArray(data)) {
        console.warn('[AI工具] GAS 回傳非陣列：', data);
        aiToolsLoading = false;
        return;
      }
      const newHash = JSON.stringify(data);
      if (newHash !== aiToolsHashState) {
        aiToolsData = data;
        aiToolsHashState = newHash;
        aiToolsLastUpdate = new Date();
        aiToolsLoading = false;
        if (currentTab === 'aitools') render();
      } else {
        aiToolsLoading = false;
      }
    })
    .catch(err => { console.error('[AI工具] fetch 失敗：', err); aiToolsLoading = false; });
}

let aiToolsData = [];
let aiToolsHashState = '';
let aiToolsLoading = true;
let aiToolsLastUpdate = null;

// 將 updateTime 格式化為 Windows 檔案總管風格：YYYY/M/D 上午/下午 HH:mm
function formatUpdateTime(raw) {
  if (!raw || raw === '-') return '-';
  const d = new Date(raw);
  if (isNaN(d.getTime())) return esc(raw);
  const y = d.getFullYear();
  const M = d.getMonth() + 1;
  const day = d.getDate();
  let h = d.getHours();
  const mm = String(d.getMinutes()).padStart(2, '0');
  const period = h < 12 ? '上午' : '下午';
  if (h === 0) h = 12;
  else if (h > 12) h = h - 12;
  const hh = String(h).padStart(2, '0');
  return `${y}/${M}/${day} ${period} ${hh}:${mm}`;
}

// 啟動 AI 工具即時同步 (每 5 秒抓取一次)
fetchAiTools();
setInterval(fetchAiTools, 5000);

function renderAiTools() {
  const board = document.getElementById('board');
  const searchKeyword = (document.getElementById('searchInput').value || '').toLowerCase();
  
  const container = document.createElement('div');
  container.className = 'aitools-container';
  
  // 過濾搜尋
  let filtered = aiToolsData;
  if (searchKeyword) {
    filtered = aiToolsData.filter(t =>
      (t.toolName && t.toolName.toLowerCase().includes(searchKeyword)) ||
      (t.version && t.version.toLowerCase().includes(searchKeyword)) ||
      (t.pathOutline && t.pathOutline.toLowerCase().includes(searchKeyword)) ||
      (t.description && t.description.toLowerCase().includes(searchKeyword)) ||
      (t.updateTime && t.updateTime.toLowerCase().includes(searchKeyword))
    );
  }
  
  const updateTimeStr = aiToolsLastUpdate
    ? `${aiToolsLastUpdate.getHours().toString().padStart(2,'0')}:${aiToolsLastUpdate.getMinutes().toString().padStart(2,'0')}:${aiToolsLastUpdate.getSeconds().toString().padStart(2,'0')}`
    : '同步中…';
  
  if (aiToolsLoading && aiToolsData.length === 0) {
    container.innerHTML = `
      <div class="aitools-loading">
        <div class="aitools-loading-spinner"></div>
        <div>正在從雲端載入 AI 工具資料…</div>
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="aitools-header">
        <div class="aitools-title">
          <span class="aitools-title-text">🤖 已上線 AI 工具總覽</span>
          <span class="aitools-badge">${filtered.length} 項工具</span>
        </div>
        <div class="aitools-refresh-info">
          <span class="aitools-refresh-dot"></span>
          即時同步中　最後更新：${updateTimeStr}
        </div>
      </div>
      <div class="aitools-table-wrap">
        ${filtered.length === 0 ? `
          <div class="aitools-empty">
            <div class="aitools-empty-icon">🔍</div>
            <div class="aitools-empty-text">${searchKeyword ? '找不到符合的 AI 工具' : '尚未設定任何 AI 工具'}</div>
          </div>
        ` : `
          <table class="aitools-table">
            <thead>
              <tr>
                <th>#</th>
                <th>工具名稱</th>
                <th>版本</th>
                <th>路徑大綱</th>
                <th>說明描述</th>
                <th>修改日期</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map((tool, idx) => `
                <tr>
                  <td><span class="aitools-id">${esc(tool.id || String(idx + 1))}</span></td>
                  <td><div class="aitools-tool-name"><span class="aitools-tool-icon">⚙️</span>${esc(tool.toolName || '')}</div></td>
                  <td><span class="aitools-version">🏷️ ${esc(tool.version || '-')}</span></td>
                  <td><div class="aitools-path">${esc(tool.pathOutline || '-')}</div></td>
                  <td><input class="aitools-desc-input" data-tool-id="${esc(tool.id)}" value="${esc(tool.description || '')}" placeholder="點此輸入工具說明…" onblur="saveAiToolDesc(this)" onkeydown="if(event.key==='Enter'){this.blur()}"></td>
                  <td><span class="aitools-update-time"><span class="aitools-clock-icon">🕐</span>${formatUpdateTime(tool.updateTime)}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>
    `;
  }
  
  board.appendChild(container);
}

// 前端 inline-edit 儲存描述至 GAS
function saveAiToolDesc(inputEl) {
  const toolId = inputEl.dataset.toolId;
  const newDesc = inputEl.value.trim();
  
  fetch(GAS_URL + '?type=aitools&action=updateDesc', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ id: toolId, description: newDesc })
  })
  .then(r => r.json())
  .then(res => {
    if (res && res.success) {
      inputEl.classList.add('saved');
      // 同步更新本地資料
      const tool = aiToolsData.find(t => t.id === toolId);
      if (tool) tool.description = newDesc;
      setTimeout(() => inputEl.classList.remove('saved'), 1500);
    } else {
      inputEl.classList.add('save-error');
      setTimeout(() => inputEl.classList.remove('save-error'), 2000);
    }
  })
  .catch(() => {
    inputEl.classList.add('save-error');
    setTimeout(() => inputEl.classList.remove('save-error'), 2000);
  });
}

// 攔截 render()，在 aitools 頁籤時呼叫專屬渲染
const _originalRender = render;
render = function() {
  if (currentTab === 'aitools') {
    const board = document.getElementById('board');
    board.innerHTML = '';
    renderAiTools();
    updateStats();
    return;
  }
  _originalRender();
};

</script>
</body>
